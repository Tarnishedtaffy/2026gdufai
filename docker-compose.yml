services:
  app:
    image: ${IMAGE_NAME:-gdufai:local}
    build:
      context: .
      args:
        VITE_DEMO_USER_ID: ${DEMO_USER_ID:-u_001}
    init: true
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      DEMO_USER_ID: ${DEMO_USER_ID:-u_001}
      DATABASE_PATH: /app/data/app.db
      UPLOAD_DIR: /app/uploads
    volumes:
      - app-data:/app/data
      - app-uploads:/app/uploads

volumes:
  app-data:
  app-uploads:
